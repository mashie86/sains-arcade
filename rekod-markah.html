<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekod markah — Sains Arcade</title><style>body{margin:0;background:#091326;color:#edf5ff;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#8ae7cf}h1{font-size:32px}button{font:inherit;background:#20344e;color:#edf5ff;border:1px solid #43607d;padding:12px 18px;border-radius:10px}details{padding:12px 0;border-bottom:1px solid #354565}summary{cursor:pointer}#score-records>p{padding:12px;background:#15233d;border-radius:10px}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #ffd481;outline-offset:3px}
/* Sains Arcade refreshed interface */
body{background:radial-gradient(ellipse at 15% 0%,#263765 0,transparent 45%),radial-gradient(ellipse at 95% 45%,#133f48 0,transparent 45%),#091326;min-height:100vh}main,.wrap{max-width:1100px}h1{letter-spacing:-1.5px}button{transition:transform .16s,background .16s,box-shadow .16s}button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px #0004}.primary{box-shadow:0 5px 22px #8ae7cf25}.card{background:linear-gradient(145deg,#233251,#13243b);border-color:#52658966;box-shadow:0 10px 28px #0003;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px #0006}.card .info{padding:22px}.card strong{color:#eefbff}.card .info>span{color:#93e8d3}.art{height:180px;font-size:78px;position:relative}.art:after{content:'SAINS ARCADE';position:absolute;bottom:10px;right:14px;font-size:10px;letter-spacing:3px;color:#fff9}.hud,.stats{padding:16px 20px;background:#142b43bb;border:1px solid #42638566;border-radius:14px}.hud>span,.stats>span{font-weight:600}.arena{box-shadow:0 15px 50px #0005}.eyebrow,.tag{display:inline-block;padding:7px 12px;border-radius:30px;background:#76ead014}.record-card{background:linear-gradient(135deg,#213d57,#14263e);padding:22px;border:1px solid #547b9566;border-radius:18px;margin:18px 0;box-shadow:0 8px 24px #0003}.record-card h3{margin:0 0 12px;font-size:22px}.record-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.record-metrics>div{background:#091b3088;border-radius:12px;padding:12px}.record-metrics strong{display:block;font-size:26px;color:#9cf0d4}.record-metrics span{color:#b9cbdf;font-size:13px}.quiz-strip{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0;color:#d4e7f5}.quiz-strip .correct-count{color:#9cf0d4}.quiz-strip .wrong-count{color:#ffb1b1}.accuracy-track{height:9px;background:#425773;border-radius:10px;overflow:hidden}.accuracy-track>div{height:100%;background:linear-gradient(90deg,#6de4cb,#98d8ff)}.record-card details{margin-top:14px}.record-card p{background:none!important;padding:0!important}.record-empty{color:#b9cbdf}.records-intro{color:#bdd1e6}#score-records>h2{display:none}@media(max-width:560px){.art{height:125px;font-size:50px}.card .info{padding:14px}.card strong{font-size:19px}.record-card{padding:16px}.record-metrics{gap:6px}.record-metrics>div{padding:9px}.record-metrics strong{font-size:21px}.hud,.stats{gap:12px;padding:12px}.art:after{font-size:8px;letter-spacing:1px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><a href="index.html">← Kembali ke homepage</a><span class="eyebrow">PENCAPAIAN ANDA</span><h1>Makmal pencapaian</h1><section id="score-records"></section></main><script>window.ArcadeFX=(()=>{
const KEY='sains-arcade-records-v1';let records={},enabled=true,audio,lastSound=0;
try{records=JSON.parse(localStorage.getItem(KEY)||'{}');enabled=localStorage.getItem('sains-sound')!=='off';}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));}catch(e){}}
function unlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
const tunes={shoot:[[650,.05],[220,.06]],collect:[[660,.07],[990,.09]],hit:[[130,.08],[65,.12]],correct:[[523,.1],[659,.1],[784,.18]],wrong:[[220,.13],[165,.2]],win:[[523,.1],[659,.1],[784,.1],[1047,.3]],start:[[330,.08],[440,.08],[660,.15]]};
function sound(kind){if(!enabled||document.hidden)return;unlock();if(!audio)return;const now=audio.currentTime;if((kind==='collect'||kind==='shoot')&&now-lastSound<.14)return;lastSound=now;if(kind==='shoot'){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(950,now);o.frequency.exponentialRampToValueAtTime(280,now+.12);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.025,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+.14);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.16);return;}let t=now;for(const [f,d] of tunes[kind]||tunes.collect){const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='shoot'?'sawtooth':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02);t+=d;}}
function update(game,score){const r=records[game]||{best:0,last:0,plays:0,history:[]};r.best=Math.max(r.best,score);r.last=score;records[game]=r;persist();render();}
function finish(game,score,correct,total,answered=total){update(game,score);const r=records[game];r.plays++;r.lastQuiz={correct,wrong:answered-correct,answered,total};r.history=[{score,correct,wrong:answered-correct,answered,total,date:new Date().toISOString()},...(r.history||[])].slice(0,10);persist();render();sound('win');}
function render(){const panel=document.getElementById('score-records');if(!panel)return;panel.replaceChildren();const intro=document.createElement('p');intro.className='records-intro';intro.textContent='Pencapaian anda dalam empat game. Betul dan salah ialah jawapan kuiz, bukan halangan dalam game.';panel.append(intro);const names={sling:'☄️ Gravity Sling',carrom:'🚀 Meteor Blaster',gems:'💎 Crystal Match',runner:'⚡ Energy Run'};for(const [id,name] of Object.entries(names)){const r=records[id],card=document.createElement('article');card.className='record-card';const title=document.createElement('h3');title.textContent=name;card.append(title);if(!r){const p=document.createElement('p');p.className='record-empty';p.textContent='Belum dimainkan. Mulakan cabaran pertama anda!';card.append(p);}else{const metrics=document.createElement('div');metrics.className='record-metrics';[['Markah terbaik',r.best],['Markah terkini',r.last],['Sesi tamat',r.plays]].forEach(([label,value])=>{const box=document.createElement('div'),v=document.createElement('strong'),l=document.createElement('span');v.textContent=value;l.textContent=label;box.append(v,l);metrics.append(box);});card.append(metrics);const q=r.lastQuiz||r.history?.[0];if(q){const answered=q.answered??q.total,wrong=q.wrong??Math.max(0,answered-q.correct);const strip=document.createElement('div');strip.className='quiz-strip';for(const [text,cls] of [['✓ Betul: '+q.correct,'correct-count'],['✕ Salah: '+wrong,'wrong-count'],['Dijawab: '+answered+'/'+q.total,'']]){const span=document.createElement('span');span.className=cls;span.textContent=text;strip.append(span);}card.append(strip);const track=document.createElement('div'),fill=document.createElement('div');track.className='accuracy-track';const pct=answered?Math.round(q.correct/answered*100):0;track.setAttribute('role','img');track.setAttribute('aria-label',pct+' peratus jawapan betul');fill.style.width=pct+'%';track.append(fill);card.append(track);const p=document.createElement('p');p.textContent='Ketepatan sesi terakhir: '+pct+'%';card.append(p);}else{const p=document.createElement('p');p.textContent='Tamatkan sesi untuk merekod jawapan betul dan salah.';card.append(p);}if(r.history?.length){const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Lihat sejarah sesi';details.append(summary);r.history.forEach(h=>{const p=document.createElement('p'),answered=h.answered??h.total;p.textContent=new Date(h.date).toLocaleString('ms-MY')+' · '+h.score+' mata · Betul '+h.correct+' · Salah '+(h.wrong??Math.max(0,answered-h.correct))+' · Dijawab '+answered+'/'+h.total;details.append(p);});card.append(details);}}panel.append(card);}const p=document.createElement('p');p.className='records-intro';p.textContent='Rekod disimpan pada peranti dan pelayar ini. Markah terkini boleh termasuk sesi yang belum tamat; keputusan kuiz di atas merujuk sesi terakhir yang tamat.';panel.append(p);}
function init(){const main=document.querySelector('main');if(!main)return;render();const controls=document.createElement('div'),button=document.createElement('button');controls.style.margin='12px 0';button.textContent=enabled?'Bunyi: ON':'Bunyi: OFF';button.setAttribute('aria-pressed',String(enabled));button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Bunyi: ON':'Bunyi: OFF';button.setAttribute('aria-pressed',String(enabled));try{localStorage.setItem('sains-sound',enabled?'on':'off');}catch(e){}if(enabled)sound('collect');};controls.append(button);main.prepend(controls);const link=document.createElement('a');link.href='rekod-markah.html';link.textContent='Rekod markah';link.style.cssText='display:inline-block;margin-left:12px;color:#8ae7cf;text-decoration:underline;padding:10px';controls.append(link);document.addEventListener('pointerdown',unlock,{once:true});document.addEventListener('keydown',unlock,{once:true});}
return{init,sound,update,finish};})();window.ArcadeFX.init();window.ArcadeFX.update;

</script><script>window.addEventListener('storage',()=>location.reload());</script></body></html>
