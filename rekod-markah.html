<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekod markah — Sains Arcade</title><style>body{margin:0;background:#091326;color:#edf5ff;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#8ae7cf}h1{font-size:32px}button{font:inherit;background:#20344e;color:#edf5ff;border:1px solid #43607d;padding:12px 18px;border-radius:10px}details{padding:12px 0;border-bottom:1px solid #354565}summary{cursor:pointer}#score-records>p{padding:12px;background:#15233d;border-radius:10px}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #ffd481;outline-offset:3px}</style></head><body><main><a href="index.html">← Kembali ke homepage</a><h1>Rekod permainan</h1><section id="score-records"></section></main><script>window.ArcadeFX=(()=>{
const KEY='sains-arcade-records-v1';let records={},enabled=true,audio,lastSound=0;
try{records=JSON.parse(localStorage.getItem(KEY)||'{}');enabled=localStorage.getItem('sains-sound')!=='off';}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));}catch(e){}}
function unlock(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
const tunes={shoot:[[650,.05],[220,.06]],collect:[[660,.07],[990,.09]],hit:[[130,.08],[65,.12]],correct:[[523,.1],[659,.1],[784,.18]],wrong:[[220,.13],[165,.2]],win:[[523,.1],[659,.1],[784,.1],[1047,.3]],start:[[330,.08],[440,.08],[660,.15]]};
function sound(kind){if(!enabled||document.hidden)return;unlock();if(!audio)return;const now=audio.currentTime;if((kind==='collect'||kind==='shoot')&&now-lastSound<.14)return;lastSound=now;if(kind==='shoot'){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(950,now);o.frequency.exponentialRampToValueAtTime(280,now+.12);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.025,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+.14);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+.16);return;}let t=now;for(const [f,d] of tunes[kind]||tunes.collect){const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='shoot'?'sawtooth':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02);t+=d;}}
function update(game,score){const r=records[game]||{best:0,last:0,plays:0,history:[]};r.best=Math.max(r.best,score);r.last=score;records[game]=r;persist();render();}
function finish(game,score,correct,total,answered=total){update(game,score);const r=records[game];r.plays++;r.lastQuiz={correct,wrong:answered-correct,answered,total};r.history=[{score,correct,wrong:answered-correct,answered,total,date:new Date().toISOString()},...(r.history||[])].slice(0,10);persist();render();sound('win');}
function render(){const panel=document.getElementById('score-records');if(!panel)return;panel.replaceChildren();const title=document.createElement('h2');title.textContent='Rekod markah anda';panel.append(title);const names={sling:'Gravity Sling',carrom:'Meteor Blaster',gems:'Crystal Match',runner:'Energy Run'};for(const [id,name] of Object.entries(names)){const r=records[id],p=document.createElement('p');p.textContent=name+' — '+(r?'Terbaik: '+r.best+' · Terkini: '+r.last+' · Sesi tamat: '+r.plays:'Belum dimainkan');panel.append(p);if(r?.lastQuiz){const q=document.createElement('p');q.textContent='Soalan sesi terakhir — Betul: '+r.lastQuiz.correct+' · Salah: '+r.lastQuiz.wrong+' · Dijawab: '+r.lastQuiz.answered+'/'+r.lastQuiz.total;panel.append(q);}if(r&&r.history?.length){const d=document.createElement('details'),s=document.createElement('summary');s.textContent='Sejarah '+name;d.append(s);r.history.forEach(h=>{const p=document.createElement('p');p.textContent=new Date(h.date).toLocaleString('ms-MY')+' · '+h.score+' mata · Sains '+h.correct+'/'+h.total;d.append(p);});panel.append(d);}}const p=document.createElement('p');p.textContent='Rekod disimpan dalam pelayar pada peranti ini. Padam data laman akan memadam rekod. Markah terkini termasuk sesi yang belum tamat.';panel.append(p);}
function init(){const main=document.querySelector('main');if(!main)return;render();const controls=document.createElement('div'),button=document.createElement('button');controls.style.margin='12px 0';button.textContent=enabled?'Bunyi: ON':'Bunyi: OFF';button.setAttribute('aria-pressed',String(enabled));button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Bunyi: ON':'Bunyi: OFF';button.setAttribute('aria-pressed',String(enabled));try{localStorage.setItem('sains-sound',enabled?'on':'off');}catch(e){}if(enabled)sound('collect');};controls.append(button);main.prepend(controls);const link=document.createElement('a');link.href='rekod-markah.html';link.textContent='Rekod markah';link.style.cssText='display:inline-block;margin-left:12px;color:#8ae7cf;text-decoration:underline;padding:10px';controls.append(link);document.addEventListener('pointerdown',unlock,{once:true});document.addEventListener('keydown',unlock,{once:true});}
return{init,sound,update,finish};})();window.ArcadeFX.init();window.ArcadeFX.update;

</script><script>window.addEventListener('storage',()=>location.reload());</script></body></html>
